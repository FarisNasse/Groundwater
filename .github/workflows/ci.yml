name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m pip install ruff==0.14.0
      - run: python -m ruff check .
      - run: node --check src/groundwater/web/app.js
      - run: node --test tests/test_web.cjs
      - run: python -m unittest discover -s tests -v
      - run: groundwater replay --file examples/usgs_daily_2023_2024.geojson --root artifacts/ci
      - run: groundwater study --file configs/study.json --root artifacts/ci-study
  locked-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-py312.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
